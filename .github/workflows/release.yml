# Instaladores: Windows (.exe), Linux (.deb x64 y ARM), macOS (.dmg) y Android (.apk),
# más la app de escritorio (Electron): Windows (.exe), Linux (AppImage y .deb) y macOS (.dmg).
# - Al publicar un release: los compila, los prueba y los adjunta al release (con SHA256SUMS.txt).
# - En los PR que tocan el empaquetado: los compila y prueba, y quedan como artefactos del workflow.
# - A mano (Actions -> Instaladores -> Run workflow): para un tag ya existente.
name: Instaladores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release (por ejemplo v1.3.3)'
        required: true
  pull_request:
    paths:
      - 'packaging/**'
      - 'desktop/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verificar iconos de marca
        run: |
          cmp public/icon-512.png desktop/build/icon.png
          cmp public/icon-512.png packaging/icon-512.png
          cmp desktop/build/icon.ico packaging/windows/zer0code.ico
      - id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            # PR: versión del package.json marcada como de prueba
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p 'require("./package.json").version')-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (.exe)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preparar la app
        run: bash packaging/stage-app.sh "$PWD/dist/stage"
      - name: Probar la app preparada
        run: bash packaging/smoke-test.sh dist/stage/runtime/node.exe dist/stage/app
      - name: Instalar Inno Setup si falta
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Compilar el instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.version.outputs.version }}" "/DStageDir=$PWD\dist\stage" "/DOutputDir=$PWD\dist\out" packaging\windows\Zer0Code.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probar el instalador (instalación silenciosa)
        run: |
          SETUP="$(ls dist/out/*.exe)"
          "$SETUP" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          INSTALLED="$LOCALAPPDATA/Programs/Zer0Code"
          ls "$INSTALLED"
          bash packaging/smoke-test.sh "$INSTALLED/runtime/node.exe" "$INSTALLED/app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/out/*.exe
          if-no-files-found: error

  linux:
    name: Linux (.deb ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preparar la app
        run: bash packaging/stage-app.sh "$PWD/dist/stage"
      - name: Construir el .deb
        run: bash packaging/linux/build-deb.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch }}" "$PWD/dist/stage" "$PWD/dist/out"
      - name: Probar el .deb (instalar, arrancar y desinstalar)
        run: |
          sudo apt-get install -y "$PWD/$(ls dist/out/*.deb)"
          zer0code version
          bash packaging/smoke-test.sh /opt/zer0code/runtime/node /opt/zer0code/app
          sudo apt-get remove -y zer0code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/out/*.deb
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preparar la app
        run: bash packaging/stage-app.sh "$PWD/dist/stage"
      - name: Construir Zer0Code.app y el .dmg
        run: |
          # hdiutil a veces falla en los runners con «Resource busy»: reintentar
          for i in 1 2 3; do bash packaging/macos/build-dmg.sh "${{ needs.version.outputs.version }}" "$PWD/dist/stage" "$PWD/dist/out" && break; sleep 10; done
          ls dist/out/*.dmg
      - name: Probar el .dmg (montar y arrancar)
        run: |
          MOUNT="$(mktemp -d)"
          hdiutil attach "$(ls dist/out/*.dmg)" -mountpoint "$MOUNT" -nobrowse
          # Limpiar también si la firma o el smoke test fallan, conservando su error.
          trap 'hdiutil detach -force "$MOUNT" || true' EXIT
          RES="$MOUNT/Zer0Code.app/Contents/Resources"
          codesign --verify "$MOUNT/Zer0Code.app"
          bash packaging/smoke-test.sh "$RES/runtime/node" "$RES/app"
          detached=0
          for attempt in 1 2 3; do
            if hdiutil detach "$MOUNT"; then detached=1; break; fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          if [ "$detached" -eq 0 ]; then hdiutil detach -force "$MOUNT"; fi
          trap - EXIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/out/*.dmg
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ -n "${{ needs.version.outputs.tag }}" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64: un release no se puede firmar con la clave de depuración"; exit 1
          else
            echo "Sin clave de firma: se firma con la de depuración (solo para probar)"
          fi
      - name: Compilar el APK
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p packaging/android assembleRelease --no-daemon
      - name: Verificar la firma
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir -p dist/out
          cp packaging/android/app/build/outputs/apk/release/app-release.apk "dist/out/Zer0Code-${{ needs.version.outputs.version }}.apk"
          "$APKSIGNER" verify --print-certs dist/out/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dist/out/*.apk
          if-no-files-found: error

  desktop:
    name: Escritorio (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Linux ARM
            runner: ubuntu-24.04-arm
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preparar el servidor que va dentro de la app
        run: bash packaging/stage-app.sh "$PWD/dist/stage" --no-runtime --no-ai-tools
      - name: Instalar Electron y electron-builder
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Compilar la app de escritorio
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - name: Probar el servidor integrado (Electron funcionando como Node)
        run: |
          OUT="$PWD/dist/desktop"
          case "$RUNNER_OS" in
            Linux)   ELECTRON="$(ls "$OUT"/linux*-unpacked/zer0code* | head -1)"; APP="$(ls -d "$OUT"/linux*-unpacked/resources/app-server)" ;;
            Windows) ELECTRON="$OUT/win-unpacked/Zer0Code.exe"; APP="$OUT/win-unpacked/resources/app-server" ;;
            macOS)   ELECTRON="$(ls -d "$OUT"/mac*/Zer0Code.app)/Contents/MacOS/Zer0Code"; APP="$(ls -d "$OUT"/mac*/Zer0Code.app)/Contents/Resources/app-server" ;;
          esac
          ELECTRON_RUN_AS_NODE=1 bash packaging/smoke-test.sh "$ELECTRON" "$APP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error

  publish:
    name: Adjuntar al release
    needs: [version, windows, linux, macos, android, desktop]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Subir instaladores y SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" * --clobber --repo "${{ github.repository }}"
