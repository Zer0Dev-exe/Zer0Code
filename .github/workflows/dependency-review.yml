# Revisión de dependencias: en cada PR compara las dependencias nuevas o actualizadas con la base de
# vulnerabilidades de GitHub y falla si alguna tiene una vulnerabilidad conocida de gravedad alta o crítica.
name: Revisión de dependencias

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependencias del PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Resumen en el PR solo cuando hay algo que contar
          comment-summary-in-pr: on-failure
