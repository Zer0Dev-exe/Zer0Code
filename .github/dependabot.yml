# Configuración de Dependabot: actualizaciones mensuales agrupadas.
# Las actualizaciones de seguridad se abren al momento (activadas en Settings), en todos los ecosistemas de aquí.
# Los PR que pasan los tests se mergean solos salvo las subidas de versión major (ver ci.yml).
version: 2
updates:
  # Servidor y web
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # App de escritorio (Electron y electron-builder)
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Acciones de los workflows (fijadas a un commit: Dependabot mantiene el commit y el comentario de versión)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

  # App de Android
  - package-ecosystem: "gradle"
    directory: "/packaging/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
